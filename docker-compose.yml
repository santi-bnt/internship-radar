services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: internship_radar
      POSTGRES_USER: internship
      POSTGRES_PASSWORD: internship
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U internship -d internship_radar"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://internship:internship@db:5432/internship_radar
      FRONTEND_URL: http://localhost:3000
      SCHEDULER_ENABLED: "true"
      SEARCH_SCHEDULER_ENABLED: "true"
      HIGH_PRIORITY_SEARCH_INTERVAL_HOURS: "6"
      GENERAL_SEARCH_INTERVAL_HOURS: "24"
      VERIFY_JOBS_INTERVAL_HOURS: "24"
      EXPIRE_JOBS_INTERVAL_HOURS: "24"
      SCHEDULER_HOUR: "7"
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_RECIPIENT: ${EMAIL_RECIPIENT:-notifications@example.com}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Internship Radar}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      EMAIL_PRIORITY_ALERTS: ${EMAIL_PRIORITY_ALERTS:-true}
      EMAIL_DAILY_DIGEST: ${EMAIL_DAILY_DIGEST:-false}
      EMAIL_DEADLINE_ALERTS: ${EMAIL_DEADLINE_ALERTS:-false}
      EMAIL_FOLLOW_UP_ALERTS: ${EMAIL_FOLLOW_UP_ALERTS:-false}
      EMAIL_STATUS_CHANGE_ALERTS: ${EMAIL_STATUS_CHANGE_ALERTS:-false}
      EMAIL_DIGEST_HOUR: ${EMAIL_DIGEST_HOUR:-8}
      USER_TIMEZONE: ${USER_TIMEZONE:-America/Mexico_City}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
      USER_IDENTITY_SIGNING_SECRET: ${USER_IDENTITY_SIGNING_SECRET:-}
      PRIMARY_USER_ID: ${PRIMARY_USER_ID:-}
      AUTHORIZED_USER_EMAILS: ${AUTHORIZED_USER_EMAILS:-}
      APP_ACCESS_ENABLED: ${APP_ACCESS_ENABLED:-false}
      RESUME_EMAIL: ${RESUME_EMAIL:-resume@example.com}
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-notifications@example.com}
      RESUME_GENERATION_PROVIDER: ${RESUME_GENERATION_PROVIDER:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_RESUME_MODEL: ${OPENAI_RESUME_MODEL:-gpt-5.6}
      TECTONIC_PATH: ${TECTONIC_PATH:-tectonic}
      PORT: "8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      INTERNAL_API_URL: http://backend:8000
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
      USER_IDENTITY_SIGNING_SECRET: ${USER_IDENTITY_SIGNING_SECRET:-}
      PRIMARY_USER_ID: ${PRIMARY_USER_ID:-}
      AUTHORIZED_USER_EMAILS: ${AUTHORIZED_USER_EMAILS:-}
      APP_ACCESS_ENABLED: ${APP_ACCESS_ENABLED:-false}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      RESUME_EMAIL: ${RESUME_EMAIL:-resume@example.com}
      NOTIFICATION_EMAIL: ${NOTIFICATION_EMAIL:-notifications@example.com}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
