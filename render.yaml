services:
  - type: web
    name: internship-radar-demo-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: SEARCH_SCHEDULER_ENABLED
        value: "false"
      - key: TECTONIC_PATH
        value: tectonic
      - key: USER_TIMEZONE
        value: America/Mexico_City
      - key: FRONTEND_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: INTERNAL_API_SECRET
        sync: false
      - key: USER_IDENTITY_SIGNING_SECRET
        sync: false
      - key: PRIMARY_USER_ID
        value: public-demo
      - key: AUTHORIZED_USER_EMAILS
        value: demo@example.com
      - key: APP_ACCESS_ENABLED
        value: "true"
      - key: RESUME_EMAIL
        value: resume@example.com
      - key: NOTIFICATION_EMAIL
        value: notifications@example.com
      - key: EMAIL_RECIPIENT
        value: notifications@example.com
      - key: EMAIL_ENABLED
        value: "false"
      - key: DEMO_FEED_ENABLED
        value: "true"
