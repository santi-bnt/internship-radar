services:
  - type: web
    name: internship-radar-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: SEARCH_SCHEDULER_ENABLED
        value: "false"
      - key: TECTONIC_PATH
        value: tectonic
      - key: USER_TIMEZONE
        value: America/Mexico_City
      - key: FRONTEND_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: INTERNAL_API_SECRET
        sync: false
      - key: USER_IDENTITY_SIGNING_SECRET
        sync: false
      - key: PRIMARY_USER_ID
        sync: false
      - key: AUTHORIZED_USER_EMAILS
        sync: false
      - key: APP_ACCESS_ENABLED
        value: "false"
      - key: RESUME_EMAIL
        sync: false
      - key: NOTIFICATION_EMAIL
        sync: false
      - key: EMAIL_RECIPIENT
        sync: false
